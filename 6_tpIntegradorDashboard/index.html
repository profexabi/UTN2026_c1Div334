<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">

    <!-- Preset CSS -->
    <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura-vader.css" type="text/css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" class="logo-container">
                <img src="assets/img/pumpernic-cuadrado.png" alt="logo pumpernic">
            </a>
        </div>

        <ul class="enlaces">
            <li class="enlace">
                <a href="index.html">
                    <span>VER</span>
                </a>
            </li>

            <li class="enlace">
                <a href="get.html">
                    <span>CONSULTAR</span>
                </a>
            </li>

            <li class="enlace">
                <a href="post.html">
                    <span>CREAR</span>
                </a>
            </li>

            <li class="enlace">
                <a href="put.html">
                    <span>MODIFICAR</span>
                </a>
            </li>

            <li class="enlace">
                <a href="delete.html">
                    <span>ELIMINAR</span>
                </a>
            </li>
        </ul>
    </header>

    <main>

        <section class="secccion-productos">
            <h2>Nuestros productos</h2>
            <div id="contenedor-productos">
                <!-- 
                <div class="card-producto">
                    <img src="assets/img/pumpernic-cuadrado.png" alt="">
                    <h4>hamburguesa</h4>
                    <p>Id: 1</p>
                    <p>$3000</p>
                </div>
                 -->
            </div>
        </section>
    </main>

    <script>
        const contenedorProductos = document.getElementById("contenedor-productos");

        async function mostrarProductos () {
            try {
                const response = await fetch("http://localhost:3000/api/products");
                const datos = await response.json();

                ////////////////////
                // Optimizacion 1: Verificamos que la respuesta HTTP fue exitosa, caso contrario, crearmos un error
                if(!response.ok) {
                    throw new Error(`Error: ${response.status} ${response.message}`);
                }

                const productos = datos.payload;
                console.log(productos);

                renderizarProductos(productos);


            } catch (error) {
                console.error(`Error al cargar productos: ${error}`);

                ////////////////////
                // Optimizacion 2: Mostramos el error en el DOM
                contenedorProductos.innerHTML = `
                    <p class="mensaje-error">${error}</p>
                `;
            }
        }

        function renderizarProductos(array) {
            let htmlProductos = "";
        
            array.forEach(producto => {
                htmlProductos += `
                <div class="card-producto">
                    <img src="${producto.image}" alt="${producto.name}">
                    <h4>${producto.name}</h4>
                    <p>Id: ${producto.id}</p>
                    <p>$${producto.price}</p>
                </div>
                `;

                contenedorProductos.innerHTML = htmlProductos;
            })
        }

        mostrarProductos();
    </script>
    
</body>
</html>
